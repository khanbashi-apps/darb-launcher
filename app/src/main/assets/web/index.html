<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>درب — النموذج الحي v1.4</title>
<link href="fonts.css" rel="stylesheet">
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'IBM Plex Sans Arabic',sans-serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1024px;height:600px;position:relative;flex:none;transform-origin:center center;background:#000;overflow:hidden;border-radius:6px}
#screen{position:absolute;overflow:hidden;background:var(--wall);transition:filter .4s}
#trim{position:absolute;inset:0;pointer-events:none;z-index:90}
.num{font-family:'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:#fff}
.ic{display:inline-block;vertical-align:middle;flex:none}
/* layout */
.shell{position:absolute;inset:0;display:grid}
.shell.d-bottom{grid-template-rows:30px 1fr 66px;grid-template-columns:1fr}
.shell.d-right{grid-template-rows:30px 1fr;grid-template-columns:78px 1fr}
.shell.d-left{grid-template-rows:30px 1fr;grid-template-columns:1fr 78px}
.status{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px;background:rgba(0,0,0,.25);position:relative;z-index:5}
.status .mid{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;opacity:.9}
.tag{font-size:10.5px;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);letter-spacing:.2px}
.tag.acc{background:var(--acc);border-color:transparent;color:#000;font-weight:600}
.status .side{display:flex;gap:10px;align-items:center}
.simbtn{display:flex;gap:5px;align-items:center;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.08);font-size:11px}
.simbtn.on{background:color-mix(in srgb,var(--acc) 25%,transparent);color:#fff}
main{position:relative;overflow:hidden;min-width:0;min-height:0}
.dock{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 10px;background:rgba(0,0,0,.35);border-top:1px solid rgba(255,255,255,.06);position:relative;z-index:6}
.d-right .dock,.d-left .dock{flex-direction:column;border-top:0;padding:8px 6px}
.d-right .dock{grid-row:2;grid-column:1;border-left:1px solid rgba(255,255,255,.06)}
.d-left .dock{grid-row:2;grid-column:2;border-right:1px solid rgba(255,255,255,.06)}
.d-right main{grid-row:2;grid-column:2}.d-left main{grid-row:2;grid-column:1}
.dk{width:64px;height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:rgba(255,255,255,.72);transition:background .2s}
.dk.on{background:color-mix(in srgb,var(--acc) 22%,transparent);color:#fff}
.dk.on .ic{color:var(--acc)}
.dk .ai{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.dsep{width:1px;height:34px;background:rgba(255,255,255,.12);margin:0 4px}
.d-right .dsep,.d-left .dsep{width:34px;height:1px;margin:4px 0}
/* cards */
.card{background:var(--cbg);border:1px solid var(--cbd);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:20px;position:relative;overflow:hidden}
.ch{display:flex;align-items:center;gap:7px;font-size:12px;opacity:.75;margin-bottom:6px}
.ch .ic{color:var(--acc)}
.muted{opacity:.6}.small{font-size:11px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:30px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);font-size:12.5px;white-space:nowrap}
.pill.on{background:var(--acc);color:#000;border-color:transparent;font-weight:600}
.pill.on .ic{color:#000}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:12px;background:rgba(255,255,255,.1);font-size:13px;white-space:nowrap}
.btn.pri{background:var(--acc);color:#000;font-weight:600}
.btn.red{background:rgba(255,74,61,.18);color:#FF8A80}
.rb{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1)}
.rb.pri{background:var(--acc);color:#000}
.scroll{overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.hscroll{overflow-x:auto;scrollbar-width:none;display:flex;gap:8px}.hscroll::-webkit-scrollbar{display:none}
/* road & car */
.roadwrap{position:absolute;inset:0;overflow:hidden}
.brake{transition:fill .15s,filter .15s}
/* gauge */
.gnum,.b-acc{direction:ltr;unicode-bidi:isolate}.gnum{font-family:'Space Grotesk',sans-serif;font-weight:700;line-height:1}
/* overlay / sheet */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;animation:fi .18s}
.sheet{background:#17181C;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:18px;max-height:92%;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.sheet h3{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.toast{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);background:#202227;border:1px solid rgba(255,255,255,.14);padding:9px 18px;border-radius:30px;font-size:13px;z-index:80;animation:fi .2s;white-space:nowrap}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kopt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:16px;background:rgba(255,255,255,.06);font-size:12.5px;border:1px solid transparent}
.kopt.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.kopt .ic{color:var(--acc)}
.kopt[disabled]{opacity:.3;pointer-events:none}
/* lists */
.row{display:flex;align-items:center;gap:12px}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05)}
.li.on{background:color-mix(in srgb,var(--acc) 18%,transparent)}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Cairo';flex:none}
.search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:14px;padding:0 12px;height:40px}
.search input{background:none;border:0;outline:0;flex:1;font-size:14px;min-width:0}
.tabs{display:flex;gap:6px}
/* G grid */
.ggrid{position:absolute;inset:14px 16px 30px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:14px}
.gw{position:relative}
.gw .card{position:absolute;inset:0}
.gw.wig .card{animation:wig .3s infinite alternate}
@keyframes wig{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
.dots{position:absolute;bottom:9px;left:0;right:0;display:flex;justify-content:center;gap:7px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots i.on{background:#fff}
.gmenu{position:absolute;z-index:60;background:rgba(30,31,36,.96);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:6px;min-width:200px;animation:pop .15s;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.gmenu .mi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13.5px;width:100%}
.gmenu .mi:hover{background:rgba(255,255,255,.07)}
.gmenu .mi.red{color:#FF8A80}
.gmenu .szs{display:flex;gap:6px;padding:6px}
.gmenu .sz{flex:1;padding:8px 0;border-radius:10px;background:rgba(255,255,255,.07);font-size:12px;text-align:center}
.gmenu .sz.on{background:var(--acc);color:#000;font-weight:600}
.gmenu .sz[disabled]{opacity:.3;pointer-events:none}
/* settings */
.set{position:absolute;inset:0;display:grid;grid-template-columns:200px 1fr}
.snav{padding:14px 10px;display:flex;flex-direction:column;gap:4px;background:rgba(0,0,0,.25);border-left:1px solid rgba(255,255,255,.06)}
.snav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:13.5px;text-align:right}
.snav button.on{background:color-mix(in srgb,var(--acc) 20%,transparent)}
.snav button.on .ic{color:var(--acc)}
.sbody{padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.sgroup{display:flex;flex-direction:column;gap:9px}
.sgroup>label,.slbl{font-size:12.5px;opacity:.65}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.tog{width:44px;height:26px;border-radius:20px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .2s}
.tog::after{content:'';position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:right .2s}
.tog.on{background:var(--acc)}.tog.on::after{right:21px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.05);font-size:13.5px}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;background:rgba(255,255,255,.18);outline:0;flex:1}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--acc);border:0}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--acc);border:0}
.tin{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;outline:0;font-size:13.5px;width:100%}
.lthumb{width:150px;height:88px;border-radius:12px;border:2px solid transparent;background:#0c0d10;position:relative;overflow:hidden}
.on>.lthumb,.lthumb.on{border-color:var(--acc)}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.2)}
.sw.on{outline:2px solid var(--acc);outline-offset:3px}
/* welcome */
.welcome{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:100;animation:fi .5s}
.shine{position:relative}
.shine .gl{position:absolute;inset:0;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.9) 50%,transparent 65%);background-size:250% 100%;animation:sh 2.2s .5s ease-in-out infinite}
@keyframes sh{from{background-position:120% 0}to{background-position:-60% 0}}
.wbar{width:160px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.wbar i{display:block;height:100%;background:var(--acc);width:0;animation:wb linear forwards}
@keyframes wb{to{width:100%}}
/* dua */
.dua{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 70px;background:radial-gradient(ellipse at 50% 120%,#3a2a12 0%,#0b0a08 60%,#000 100%);animation:fi .5s}
.duatext{font-family:'Amiri',serif;font-size:27px;line-height:2.05;text-align:center;max-width:860px}
.duatext .w{opacity:.3;transition:opacity .35s,color .35s,text-shadow .35s}
.duatext .w.done{opacity:.88}
.duatext .w.cur{opacity:1;color:#F2C46D;text-shadow:0 0 18px rgba(242,196,109,.55)}
/* map */
.mapsvg{position:absolute;inset:0;width:100%;height:100%}
.poi{cursor:pointer}
.pulse{animation:pu 1.6s infinite}
@keyframes pu{0%{r:10;opacity:.6}100%{r:34;opacity:0}}
/* maint ring */
.ring{transform:rotate(-90deg)}
/* misc */
.chip{padding:6px 12px;border-radius:20px;background:rgba(255,255,255,.07);font-size:12.5px;white-space:nowrap;border:1px solid transparent}
.chip.on{background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:var(--acc)}
.note{font-size:11px;opacity:.55;display:flex;gap:6px;align-items:center}
.lpbar{position:absolute;inset:auto 0 0 0;height:3px;background:var(--acc);transform-origin:right;transform:scaleX(0)}
#rotate{display:none}
@media (orientation:portrait) and (max-width:700px){#rotate{display:block;position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:13px;opacity:.6}}

.led{background:#050505 radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.5px) 0 0/6px 6px;border:1px solid #1e1e1e;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
.ledt{font-family:'Doto',monospace;font-weight:800;color:var(--acc);text-shadow:0 0 10px color-mix(in srgb,var(--acc) 70%,transparent)}

.brakeph{position:absolute;top:30%;height:13%;border-radius:40%;background:radial-gradient(ellipse at center,rgba(255,40,30,.95),rgba(255,30,20,.45) 45%,transparent 72%);mix-blend-mode:screen;opacity:0;transition:opacity .15s;filter:blur(2px)}

.brakeph{z-index:3}
.carwrap .beams{opacity:0;transition:opacity .8s}
.carwrap.night .beams{opacity:1}.carwrap.night .fchip{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:14px;background:#0b0b0c;border:1px solid #1a1b1e}
.fsm{font-size:11px;color:#6b7078}.fv{font-size:15px;color:#c3c7cd}
.fbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:#0b0b0c;border:1px solid #1a1b1e;color:#7c828b;font-size:12.5px}
.carimg{filter:drop-shadow(0 18px 16px rgba(0,0,0,.75));transition:filter .8s}
.carwrap.night .carimg{filter:drop-shadow(0 18px 16px rgba(0,0,0,.8)) brightness(.68) contrast(1.08)}
.tailph{position:absolute;top:29%;height:15%;border-radius:45%;z-index:2;background:radial-gradient(ellipse at center,rgba(255,70,55,.95) 0%,rgba(255,30,20,.55) 35%,rgba(255,20,10,.18) 60%,transparent 75%);mix-blend-mode:screen;opacity:0;transition:opacity .8s;filter:blur(2.5px)}
.redground{position:absolute;left:-8%;right:-8%;bottom:-9%;height:22%;z-index:0;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,30,20,.32),rgba(255,30,20,.1) 45%,transparent 70%);opacity:0;transition:opacity .8s;filter:blur(6px)}
.spill{position:absolute;top:8%;width:42%;height:40%;z-index:0;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,244,214,.22),transparent 70%);opacity:0;transition:opacity .8s;filter:blur(8px)}
.carwrap .beams{opacity:0;transition:opacity .8s}
.carwrap.night .beams,.carwrap.night .tailph,.carwrap.night .redground,.carwrap.night .spill{opacity:1}
</style></head><body>

// Method: Fajr 18°, Isha 18°, Asr shadow factor 1 (Shafi'i), sunrise/sunset 0.833°, Omani calendar precaution, ±30 min per prayer.
const PNAMES=['الفجر','الشروق','الظهر','العصر','المغرب','العشاء'];
const PR=(()=>{const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI,fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
 function julian(y,m,d){if(m<=2){y--;m+=12}const a=Math.floor(y/100),b=2-a+Math.floor(a/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+b-1524.5}
 function sun(jd){const D=jd-2451545,g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360),L=fix(q+1.915*Math.sin(rad(g))+0.02*Math.sin(rad(2*g)),360),e=23.439-0.00000036*D;
  const ra=fix(deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)),Math.cos(rad(L))))/15,24),decl=deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L))));let eqt=q/15-ra;eqt=fix(eqt+12,24)-12;return[decl,eqt]}
 const midday=(jd,t)=>fix(12-sun(jd+t)[1],24);
 function angleTime(jd,angle,t,lat,before){const decl=sun(jd+t)[0],noon=midday(jd,t);let c=(-Math.sin(rad(angle))-Math.sin(rad(decl))*Math.sin(rad(lat)))/(Math.cos(rad(decl))*Math.cos(rad(lat)));c=Math.max(-1,Math.min(1,c));const tt=deg(Math.acos(c))/15;return noon+(before?-tt:tt)}
 function asrTime(jd,f,t,lat){const decl=sun(jd+t)[0],a=-deg(Math.atan(1/(f+Math.tan(rad(Math.abs(lat-decl))))));return angleTime(jd,a,t,lat,false)}
 function compute(y,m,d,lat,lng,tz){const jd=julian(y,m,d)-lng/(15*24);let t=[5,6,12,13,18,18];
  for(let it=0;it<2;it++){const p=t.map(x=>x/24);t=[angleTime(jd,18,p[0],lat,true),angleTime(jd,.833,p[1],lat,true),midday(jd,p[2]),asrTime(jd,1,p[3],lat),angleTime(jd,.833,p[4],lat,false),angleTime(jd,18,p[5],lat,false)]}
  return t.map(x=>x+tz-lng/15)}
 function omani(h,prec){return h.map((x,i)=>{const m=x*60;if(!prec)return Math.round(m);if(i===2)return Math.round(m+5);if(i===3||i===4)return Math.ceil(m+5);return Math.round(m)})}
 return{compute,omani}})();
function place(){return PLACES.find(p=>p[0]===S.city)||PLACES.find(p=>p[0]==='البريمي')||PLACES[0]}
let _pc={};
function pmins(d=now()){const key=d.toDateString()+S.city+S.ihtiyat+S.padj.join(',');if(_pc.k===key)return _pc.v;
 const pl=place(),noon=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12),tz=-noon.getTimezoneOffset()/60;
 const base=PR.omani(PR.compute(d.getFullYear(),d.getMonth()+1,d.getDate(),pl[1],pl[2],tz),S.ihtiyat);const v=base.map((m,i)=>m+(S.padj[i]||0));_pc={k:key,v};return v}

stage.addEventListener('pointerdown',e=>{lpFired=false;swiped=false;dx0=e.clientX;dy0=e.clientY;swipeEl=e.target.closest('[data-swipe]');const el=e.target.closest('[data-lp]');clearTimeout(lpT);
 if(el)lpT=setTimeout(()=>{lpFired=true;longPress(el)},480)});
stage.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-dx0)+Math.abs(e.clientY-dy0)>12)clearTimeout(lpT)});
stage.addEventListener('pointerup',e=>{clearTimeout(lpT);const dx=e.clientX-dx0;if(swipeEl&&!lpFired&&Math.abs(dx)>70&&Math.abs(e.clientY-dy0)<60){swiped=true;const n=S.pages.length;R.gpage=dx<0?Math.max(0,R.gpage-1):Math.min(n-1,R.gpage+1);
 /* RTL: swipe right -> next page */ render()}});
stage.addEventListener('contextmenu',e=>e.preventDefault());
function longPress(el){const t=el.dataset.lp;if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
 if(t==='slot'){R.sheet={t:'slot',lay:el.dataset.lay,i:+el.dataset.i};render()}
 else if(t==='g'||t==='b'){const r=el.getBoundingClientRect(),sr=stage.getBoundingClientRect(),sc=sr.width/1024;let x=(r.left-sr.left)/sc+20,y=(r.top-sr.top)/sc+20;x=Math.min(x,1024-230);y=Math.min(y,600-250);R.gmenu={lay:t==='b'?'B':'G',i:+el.dataset.i,x,y};render()}
 else if(t==='app'){R.appMenu=el.dataset.v;render()}}
stage.addEventListener('click',e=>{if(lpFired||swiped){lpFired=false;swiped=false;e.preventDefault();return}
 const el=e.target.closest('[data-a],[data-stop]');if(!el)return;if(el.dataset.stop&&!e.target.closest('[data-a]'))return;
 const a=el.dataset.a;if(!a)return;if(el.tagName==='LABEL')return;if(A[a]){e.preventDefault();A[a](el.dataset.v,el)}});
stage.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.in){const path=t.dataset.in.split('.');let o=path[0]==='S'?S:R;for(let i=1;i<path.length-1;i++)o=o[path[i]];o[path[path.length-1]]=t.value;if(path[0]==='S')save();
  if(t.dataset.in.startsWith('R.mf'))return;render()}
 if(t.dataset.rng){const p=t.dataset.rng.split('.'),v=+t.value;if(p.length===2){S[p[0]][p[1]]=v;const l=$(`.b-ins-${p[1]}`);if(l)l.textContent=v+'px';applyTheme()}else if(p[0]==='carScale'){S.carScale=v;const l=$('.b-carscale');if(l)l.textContent=v+'%';document.querySelectorAll('.carwrap').forEach(e=>e.style.width=Math.round(220*.88*v/100)+'px')}else if(p[0]==='fdim'){S.focus.dim=v;const f=$('.focus');if(f)f.style.filter=`brightness(${v/100})`;const l=$('.b-fdim');if(l)l.textContent=v+'%'}else{S[p[0]]=v;const l=$('.b-logow');if(l)l.textContent=v+'%';const im=$('.b-logo');if(im)im.style.width=logoBase()*0.5*v/100+'px'}save()}});
stage.addEventListener('change',e=>{const t=e.target;if(t.dataset.rng){save();render();return}if(t.dataset.file&&t.files[0]){const f=t.files[0],rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const m=600,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);S[t.dataset.file]=c.toDataURL('image/png');if(t.dataset.file==='logo'){S.logoKind='custom';S.brand=null;S.logoWhite=false}save();render();toast('تم رفع الصورة')};img.src=rd.result};rd.readAsDataURL(f)}});
// ===== fit =====
function fit(){const s=Math.min(innerWidth/1024,innerHeight/600);stage.style.transform=`scale(${s})`}
window.onDarbBack=()=>{if(R.cal)return A.calclose();if(R.mf){R.mf=null;return render()}if(R.sheet||R.gal||R.gmenu||R.exp||R.appMenu||R.confirm)return A.close();if(R.screen==='focus'&&R.black)return A.focuswake();if(R.fedit){R.fedit=false;return render()}if(R.screen==='dua'||R.screen==='welcome')return;if(R.screen!=='home'){R.screen='home';render()}};
window.onDarbHome=()=>{if(R.screen==='dua'||R.screen==='welcome')return;R.sheet=R.gal=R.gmenu=R.exp=R.appMenu=R.confirm=R.mf=null;R.fedit=false;R.black=false;R.screen='home';render()};
addEventListener('resize',fit);fit();if(NATIVE){R.sim=false;loadApps()}startFlow();
</script></body></html>
